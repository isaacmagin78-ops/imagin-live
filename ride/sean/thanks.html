<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-tpl="Request sent · {firstName} · Your Personal Driver">Request sent · Your Personal Driver</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0b'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%23d4af37' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23d4af37'/%3E%3Cpath d='M12 31h14M38 31h14M32 38v14' stroke='%23d4af37' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    document.documentElement.classList.add("js");
    setTimeout(function () { if (!window.__driverReady) document.documentElement.classList.remove("js"); }, 2500);
  </script>
  <script src="config.js"></script>
  <script>try { if (CONFIG.accent) document.documentElement.style.setProperty("--gold", CONFIG.accent); } catch (e) {}</script>
</head>
<body>
<main class="hero thanks">
  <div class="road" aria-hidden="true"><div class="road__plane"><span class="road__dash"></span></div></div>

  <div class="wrap hero__inner">
    <svg class="logo reveal" viewBox="0 0 120 120" role="img" aria-label="Steering wheel and road emblem">
      <defs>
        <linearGradient id="lg-gold" gradientUnits="userSpaceOnUse" x1="14" y1="8" x2="106" y2="114">
          <stop offset="0" class="s-hi"></stop>
          <stop offset=".45" class="s-mid"></stop>
          <stop offset=".75" class="s-lo"></stop>
          <stop offset="1" class="s-hi"></stop>
        </linearGradient>
        <linearGradient id="lg-shine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"></stop>
          <stop offset=".5" stop-color="#fff" stop-opacity=".9"></stop>
          <stop offset="1" stop-color="#fff" stop-opacity="0"></stop>
        </linearGradient>
        <g id="lg-wheel">
          <circle cx="60" cy="60" r="50" fill="none" stroke-width="6"></circle>
          <circle cx="60" cy="60" r="41.5" fill="none" stroke-width="1.25" opacity=".55"></circle>
          <path d="M10.5 58c13-4 26-4.5 39.5-1.5M109.5 58c-13-4-26-4.5-39.5-1.5" fill="none" stroke-width="6" stroke-linecap="round"></path>
          <circle cx="60" cy="60" r="10" fill="none" stroke-width="4"></circle>
          <circle cx="60" cy="60" r="3.2" stroke="none"></circle>
          <path d="M56 70.5L45.5 108M64 70.5L74.5 108" fill="none" stroke-width="3.2" stroke-linecap="round"></path>
        </g>
        <mask id="lg-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
          <use href="#lg-wheel" stroke="#fff" fill="#fff"></use>
        </mask>
      </defs>
      <use href="#lg-wheel" stroke="url(#lg-gold)" fill="url(#lg-gold)"></use>
      <line class="logo-dash" x1="60" y1="76" x2="60" y2="105" stroke="url(#lg-gold)" stroke-width="2.4" stroke-linecap="round"></line>
      <g mask="url(#lg-mask)"><polygon class="logo-shine" points="0,-10 24,-10 4,130 -20,130" fill="url(#lg-shine)"></polygon></g>
    </svg>

    <p class="eyebrow reveal" style="--d:.08s">Request sent</p>
    <h1 class="name reveal" style="--d:.16s">Thank you.</h1>
    <p class="lede reveal" style="--d:.24s" data-tpl="{firstName} will text you to confirm the price and pickup time.">Your driver will text you to confirm the price and pickup time.</p>
    <p class="note reveal" style="--d:.3s">Nothing is booked until you reply to confirm.</p>
    <div class="rule reveal" style="--d:.34s" aria-hidden="true"></div>
    <p class="tagline reveal" style="--d:.38s">Same driver. Every time.</p>

    <div class="actions reveal" style="--d:.46s">
      <button class="btn btn-gold" type="button" data-vcf>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.6"/><path d="M2.8 20c.6-3.3 3.1-5.4 6.2-5.4s5.6 2.1 6.2 5.4M19 8v6M16 11h6"/></svg>
        <span data-tpl="Save {firstName} to contacts">Save to contacts</span>
      </button>
      <a class="btn btn-outline" href="./" data-sms hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.3 7.6L3.5 21l1.4-4.9A8.5 8.5 0 1 1 21 12z"/></svg>
        <span data-tpl="Text {firstName}">Text your driver</span>
      </a>
      <a class="btn btn-ghost" href="./">Back to booking page</a>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="wrap">Booking pages by IMagin · Want one? <a href="https://imaginhq.com" rel="noopener">imaginhq.com</a></div>
</footer>

<script src="app.js"></script>
</body>
</html>
