<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="IMagin Portal mark, animated" class="im-c2-anim"><style>.im-c2-anim .door-l{transform-origin:19px 35px;animation:c2-door 6s ease-in-out infinite}.im-c2-anim .door-r{transform-origin:45px 35px;animation:c2-door 6s ease-in-out infinite}@keyframes c2-door{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.72)}}.im-c2-anim .halo,.im-c2-anim .floor{animation:c2-glow 6s ease-in-out infinite}@keyframes c2-glow{0%,100%{opacity:.55}50%{opacity:1}}.im-c2-anim .motes circle{opacity:0;animation:c2-mote 4.5s ease-out infinite}.im-c2-anim .m2{animation-delay:1.5s!important}.im-c2-anim .m3{animation-delay:3s!important}@keyframes c2-mote{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-30px)}}@media (prefers-reduced-motion:reduce){.im-c2-anim *{animation:none!important}}</style><defs><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18191F"/><stop offset="1" stop-color="#0B0B0D"/></linearGradient><linearGradient id="c2-m" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="55"><stop offset="0" stop-color="#9B7BFF"/><stop class="im-aq-stop" offset="1" stop-color="#3FD0C9"/></linearGradient><linearGradient id="c2-pl" gradientUnits="userSpaceOnUse" x1="19" y1="0" x2="29" y2="0"><stop offset="0" stop-color="#5B47C9"/><stop class="im-aq-stop" offset="1" stop-color="#7EE7E1"/></linearGradient><linearGradient id="c2-pr" gradientUnits="userSpaceOnUse" x1="45" y1="0" x2="35" y2="0"><stop offset="0" stop-color="#5B47C9"/><stop class="im-aq-stop" offset="1" stop-color="#7EE7E1"/></linearGradient><linearGradient id="c2-beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C8FBF7"/></linearGradient><radialGradient id="c2-glow"><stop offset="0" stop-color="#BFF7F3" stop-opacity=".7"/><stop offset="1" stop-color="#3FD0C9" stop-opacity="0"/></radialGradient><linearGradient id="c2-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3FD0C9" stop-opacity=".6"/><stop offset="1" stop-color="#3FD0C9" stop-opacity="0"/></linearGradient></defs><rect class="im-bg" width="64" height="64" rx="14" fill="url(#tile)"/><path class="im-glow floor" fill="url(#c2-floor)" d="M29 53.5H35L45 61H19Z"/><ellipse class="im-glow halo" cx="32" cy="36" rx="8.5" ry="20" fill="url(#c2-glow)"/><path fill="url(#c2-m)" d="M11 11L17 16.67V54H11ZM53 11L47 16.67V54H53Z"/><path class="door-l" fill="url(#c2-pl)" d="M19 18.56L29 28V44L19 52Z"/><path class="door-r" fill="url(#c2-pr)" d="M45 18.56L35 28V44L45 52Z"/><rect class="im-lite beam" x="30" y="20" width="4" height="33.5" rx="2" fill="url(#c2-beam)"/><g class="motes" fill="#E9FFFD"><circle class="m1" cx="31" cy="50" r=".9"/><circle class="m2" cx="33.2" cy="50" r=".7"/><circle class="m3" cx="32" cy="50" r=".8"/></g></svg>
