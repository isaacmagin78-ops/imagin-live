<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pick the voice</title><meta name="robots" content="noindex"><meta name="theme-color" content="#0A1220">
<style>*{box-sizing:border-box}body{margin:0;background:#0A1220;color:#F4F7FB;font:400 17px/1.4 -apple-system,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
h1{font-size:26px;margin:4px 0 4px}p{color:#B6C2D4;margin:0 0 18px}
.v{background:#101B2E;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:14px;margin-bottom:16px}
.v h2{font-size:22px;margin:0 0 2px}.v span{color:#B6C2D4;font-size:15px}
video{width:100%;max-height:70vh;border-radius:14px;margin-top:10px;background:#000}</style></head>
<body><main><h1>🎙️ Pick the realtor voice</h1><p>Tap ▶️ on each, then text Sid A, B or C.</p>
<div class="v"><h2>A</h2><span>American man · warm, calm narrator</span><video src="film-A.mp4" controls playsinline preload="metadata"></video></div>
<div class="v"><h2>B</h2><span>American woman · confident, conversational</span><video src="film-B.mp4" controls playsinline preload="metadata"></video></div>
<div class="v"><h2>C</h2><span>British man · smooth, old-money calm</span><video src="film-C.mp4" controls playsinline preload="metadata"></video></div>
</main></body></html>
